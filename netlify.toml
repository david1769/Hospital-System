[build]
  base = "web/hospital-web"
  publish = "bin/Release/net9.0/publish/wwwroot"
  command = "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --install-dir /opt/buildhome/.dotnet && export PATH=\"/opt/buildhome/.dotnet:$PATH\" && dotnet publish -c Release"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200